[project]
name = "rgc"
version = "0.1.0"
description = "Symmetry breaking and flow in transformers: two output-free indicator measurements on Pythia"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "transformer-lens==3.9.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
    "datasets==5.0.1",
    "transformers==5.18.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rgc"

[tool.pytest.ini_options]
testpaths = ["tests"]
